<section class="productos-section" id="productos">
  <div class="container">
    <h4 class="center-align titulo-productos">Nuestros Productos</h4>

    <div class="row">
      <div class="col s12 m6 l4" *ngFor="let producto of productos">
        <div class="card hoverable producto-card">
          <div class="card-image">
            <img [src]="producto.imagen" [alt]="producto.nombre" />

            <span *ngIf="producto.nuevo" class="new badge green" data-badge-caption="NUEVO"></span>
            <span *ngIf="!producto.disponible" class="agotado red darken-1 white-text">
              Agotado
            </span>
          </div>

          <div class="card-content">
            <span class="card-title">{{ producto.nombre | titlecase }}</span>
            <p class="descripcion-producto">{{ producto.descripcion }}</p>

            <div class="producto-meta">
              <span class="chip">{{ producto.categoria }}</span>
              <span class="precio-producto">{{ producto.precio | currency }}</span>
            </div>
          </div>

          <div class="card-action">
            <button class="btn waves-effect waves-light" [disabled]="!producto.disponible">
              Comprar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
